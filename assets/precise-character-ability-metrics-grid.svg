<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="64" y="82" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="56" font-weight="700" fill="#111111">角色能力标尺</text>
  <line x1="64" y1="118" x2="1536" y2="118" stroke="#b01b6a" stroke-width="4"/>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="34" fill="#111111">
    <rect x="72" y="210" width="76" height="76" fill="#14aee8" stroke="#111" stroke-width="4"/>
    <text x="180" y="260">主角：1格 × 1格</text>
    <rect x="72" y="326" width="76" height="76" fill="#c8c8c8" stroke="#111" stroke-width="4"/>
    <text x="180" y="376">纵向跳跃：4格</text>
    <rect x="72" y="442" width="76" height="76" fill="#f4b183" stroke="#111" stroke-width="4"/>
    <text x="180" y="492">横向跳跃：3格安全 / 4格极限</text>
    <line x1="72" y1="570" x2="390" y2="570" stroke="#cfcfcf" stroke-width="3"/>
    <text x="72" y="636">屏幕大小：7 × 13</text>
    <text x="72" y="712">移动速度：4格/秒</text>
  </g>

  <!-- Exact 13 x 7 grid, cell = 80, origin = 440, 174 -->
  <g transform="translate(440 174)">
    <rect x="0" y="0" width="1040" height="560" fill="#fff" stroke="#111" stroke-width="5"/>
    <g stroke="#222" stroke-width="3">
      <line x1="80" y1="0" x2="80" y2="560"/>
      <line x1="160" y1="0" x2="160" y2="560"/>
      <line x1="240" y1="0" x2="240" y2="560"/>
      <line x1="320" y1="0" x2="320" y2="560"/>
      <line x1="400" y1="0" x2="400" y2="560"/>
      <line x1="480" y1="0" x2="480" y2="560"/>
      <line x1="560" y1="0" x2="560" y2="560"/>
      <line x1="640" y1="0" x2="640" y2="560"/>
      <line x1="720" y1="0" x2="720" y2="560"/>
      <line x1="800" y1="0" x2="800" y2="560"/>
      <line x1="880" y1="0" x2="880" y2="560"/>
      <line x1="960" y1="0" x2="960" y2="560"/>
      <line x1="0" y1="80" x2="1040" y2="80"/>
      <line x1="0" y1="160" x2="1040" y2="160"/>
      <line x1="0" y1="240" x2="1040" y2="240"/>
      <line x1="0" y1="320" x2="1040" y2="320"/>
      <line x1="0" y1="400" x2="1040" y2="400"/>
      <line x1="0" y1="480" x2="1040" y2="480"/>
    </g>
    <!-- vertical reach: exactly 4 cells above player -->
    <rect x="0" y="160" width="80" height="320" fill="#c8c8c8"/>
    <!-- player at col 1 row 7, exact one cell -->
    <rect x="0" y="480" width="80" height="80" fill="#14aee8"/>
    <!-- horizontal safe reach: exactly 3 cells -->
    <rect x="80" y="480" width="240" height="80" fill="#f4b183"/>
    <!-- extreme reach outline: 4th cell -->
    <rect x="320" y="480" width="80" height="80" fill="none" stroke="#e87722" stroke-width="5" stroke-dasharray="12 8"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="28" fill="#111" text-anchor="middle">
    <text x="480" y="790">1</text><text x="560" y="790">2</text><text x="640" y="790">3</text><text x="720" y="790">4</text>
    <text x="800" y="790">5</text><text x="880" y="790">6</text><text x="960" y="790">7</text><text x="1040" y="790">8</text>
    <text x="1120" y="790">9</text><text x="1200" y="790">10</text><text x="1280" y="790">11</text><text x="1360" y="790">12</text><text x="1440" y="790">13</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="28" fill="#111" text-anchor="end">
    <text x="420" y="224">7</text><text x="420" y="304">6</text><text x="420" y="384">5</text><text x="420" y="464">4</text>
    <text x="420" y="544">3</text><text x="420" y="624">2</text><text x="420" y="704">1</text>
  </g>
</svg>
