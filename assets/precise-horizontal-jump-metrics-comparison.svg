<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="64" y="82" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="54" font-weight="700" fill="#111">横向跳跃标尺：简单 vs 困难</text>
  <line x1="64" y1="118" x2="1536" y2="118" stroke="#b01b6a" stroke-width="4"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e87722"/>
    </marker>
  </defs>

  <!-- cell=48, each panel grid 13x7 = 624x336 -->
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <text x="86" y="170" font-size="32" font-weight="700" fill="#111">横向跳跃：简单（1格坑）</text>
    <g transform="translate(86 196)">
      <rect x="0" y="0" width="624" height="336" fill="#fff" stroke="#111" stroke-width="4"/>
      <g stroke="#d7d7d7" stroke-width="2">
        <path d="M48 0V336 M96 0V336 M144 0V336 M192 0V336 M240 0V336 M288 0V336 M336 0V336 M384 0V336 M432 0V336 M480 0V336 M528 0V336 M576 0V336"/>
        <path d="M0 48H624 M0 96H624 M0 144H624 M0 192H624 M0 240H624 M0 288H624"/>
      </g>
      <rect x="0" y="288" width="144" height="48" fill="#000"/>
      <rect x="192" y="288" width="432" height="48" fill="#000"/>
      <rect x="48" y="240" width="48" height="48" fill="#14aee8" stroke="#111" stroke-width="2"/>
      <path d="M72 240 C120 142, 194 142, 240 240" fill="none" stroke="#e87722" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
      <text x="168" y="326" font-size="24" text-anchor="middle" fill="#e87722">坑宽 1格</text>
    </g>

    <text x="860" y="170" font-size="32" font-weight="700" fill="#111">横向跳跃：困难（3格坑）</text>
    <g transform="translate(860 196)">
      <rect x="0" y="0" width="624" height="336" fill="#fff" stroke="#111" stroke-width="4"/>
      <g stroke="#d7d7d7" stroke-width="2">
        <path d="M48 0V336 M96 0V336 M144 0V336 M192 0V336 M240 0V336 M288 0V336 M336 0V336 M384 0V336 M432 0V336 M480 0V336 M528 0V336 M576 0V336"/>
        <path d="M0 48H624 M0 96H624 M0 144H624 M0 192H624 M0 240H624 M0 288H624"/>
      </g>
      <rect x="0" y="288" width="144" height="48" fill="#000"/>
      <rect x="288" y="288" width="336" height="48" fill="#000"/>
      <rect x="48" y="240" width="48" height="48" fill="#14aee8" stroke="#111" stroke-width="2"/>
      <path d="M72 240 C160 92, 284 92, 336 240" fill="none" stroke="#e87722" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
      <text x="216" y="326" font-size="24" text-anchor="middle" fill="#e87722">坑宽 3格</text>
    </g>
  </g>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="28" fill="#111">
    <text x="86" y="610">设计含义：简单坑低于安全跳距，用于练习。</text>
    <text x="860" y="610">设计含义：困难坑接近能力边界，用于验证。</text>
  </g>
</svg>
