<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="64" y="74" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="48" font-weight="700" fill="#111">米制/标尺 Metrics：角色能力 × 关卡元素</text>
  <line x1="64" y1="108" x2="1536" y2="108" stroke="#b01b6a" stroke-width="4"/>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <text x="74" y="154" font-size="30" font-weight="700" fill="#155fb8">角色能力标尺：固定格子</text>
    <!-- left exact 13x7 grid, cell=48 -->
    <g transform="translate(74 184)">
      <rect x="0" y="0" width="624" height="336" fill="#fff" stroke="#111" stroke-width="4"/>
      <g stroke="#d7d7d7" stroke-width="2">
        <path d="M48 0V336 M96 0V336 M144 0V336 M192 0V336 M240 0V336 M288 0V336 M336 0V336 M384 0V336 M432 0V336 M480 0V336 M528 0V336 M576 0V336"/>
        <path d="M0 48H624 M0 96H624 M0 144H624 M0 192H624 M0 240H624 M0 288H624"/>
      </g>
      <rect x="0" y="288" width="624" height="48" fill="#000"/>
      <rect x="48" y="240" width="48" height="48" fill="#14aee8" stroke="#111" stroke-width="2"/>
      <rect x="48" y="48" width="48" height="192" fill="#c8c8c8" opacity="0.9"/>
      <rect x="96" y="240" width="144" height="48" fill="#f4b183" opacity="0.95"/>
      <rect x="528" y="240" width="48" height="48" fill="#f6e943" stroke="#111" stroke-width="3"/>
      <text x="552" y="270" font-size="18" text-anchor="middle" font-weight="700">GOAL</text>
      <text x="132" y="326" font-size="20" text-anchor="middle" fill="#fff">横跳3格</text>
      <text x="116" y="72" font-size="20" fill="#111">纵跳4格</text>
    </g>

    <text x="760" y="154" font-size="30" font-weight="700" fill="#155fb8">关卡元素标尺：范围与房间</text>
    <g transform="translate(760 190)">
      <!-- top-down room 1, exact 8x5 cells -->
      <rect x="0" y="0" width="384" height="240" fill="#f8dfc8" stroke="#111" stroke-width="5"/>
      <g stroke="#e6cbb6" stroke-width="2">
        <path d="M48 0V240 M96 0V240 M144 0V240 M192 0V240 M240 0V240 M288 0V240 M336 0V240"/>
        <path d="M0 48H384 M0 96H384 M0 144H384 M0 192H384"/>
      </g>
      <rect x="-72" y="96" width="72" height="48" fill="#92d050" stroke="#111" stroke-width="4"/>
      <text x="-36" y="128" font-size="20" text-anchor="middle" font-weight="700">ENTER</text>
      <circle cx="192" cy="120" r="96" fill="#e33131" opacity="0.18"/>
      <circle cx="192" cy="120" r="26" fill="#e33131"/>
      <text x="192" y="30" font-size="22" text-anchor="middle" font-weight="700">敌人范围：2格半径</text>
      <rect x="384" y="84" width="58" height="72" fill="#cfe2f3" stroke="#111" stroke-width="4"/>
    </g>

    <g transform="translate(760 520)">
      <!-- top-down room 2, exact 10x4 cells -->
      <rect x="0" y="0" width="480" height="192" fill="#f8dfc8" stroke="#111" stroke-width="5"/>
      <g stroke="#e6cbb6" stroke-width="2">
        <path d="M48 0V192 M96 0V192 M144 0V192 M192 0V192 M240 0V192 M288 0V192 M336 0V192 M384 0V192 M432 0V192"/>
        <path d="M0 48H480 M0 96H480 M0 144H480"/>
      </g>
      <rect x="-72" y="72" width="72" height="48" fill="#92d050" stroke="#111" stroke-width="4"/>
      <text x="-36" y="104" font-size="20" text-anchor="middle" font-weight="700">ENTER</text>
      <circle cx="144" cy="96" r="84" fill="#e33131" opacity="0.16"/>
      <circle cx="144" cy="96" r="24" fill="#e33131"/>
      <polygon points="360,70 372,94 398,98 379,116 384,142 360,130 336,142 341,116 322,98 348,94" fill="#ffc000" stroke="#111" stroke-width="3"/>
      <text x="270" y="32" font-size="22" text-anchor="middle" font-weight="700">奖励距离：4格</text>
      <rect x="480" y="60" width="58" height="72" fill="#cfe2f3" stroke="#111" stroke-width="4"/>
    </g>

    <g font-size="28" fill="#111">
      <text x="74" y="598">原则：先定角色能力，再定关卡元素。</text>
      <text x="74" y="646">简单挑战低于安全阈值；困难挑战接近能力边界。</text>
      <text x="74" y="694">所有图形均按格子落位，不使用漂移透视。</text>
    </g>
  </g>
</svg>
